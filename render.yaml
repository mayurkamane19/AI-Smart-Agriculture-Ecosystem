services:
  # 1. FastAPI Python AI Backend Web Service
  - type: web
    name: krishiverse-backend
    env: python
    region: singapore
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: krishiverse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # 2. React Vite Frontend Static Site (No region allowed for static sites)
  - type: static
    name: krishiverse-frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"

databases:
  # 3. PostgreSQL Database
  - name: krishiverse-db
    databaseName: krishiverse
    user: krishi_admin
    region: singapore
